<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traffic Light</title>
    <style>
        .container{
            width: 220px;
            height: 420;
            border: 3px solid;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            margin: 80px auto;
            background-color: #fff;
        }
        .light{
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }
        .red{ background-color: red;}

        .yellow{ background-color: yellow;}

        .green{ background-color: green;}
    </style>
</head>
<body>
    <dev class="container">
        <div class="light red"></div>

        <div class="light yellow"></div>

        <div class="light green"></div>
    </dev>
</body>
</html>
